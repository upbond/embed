# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Publishing @upbond/embed to npm

on:
  release:
    types: [published]
  workflow_dispatch:

# 既定は読み取りのみ。publish ジョブでのみ昇格させる（upbond-executives#46 / C2）
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
      - run: npm ci --legacy-peer-deps
      - run: npm run build

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    # 人手 publish を禁止し、承認ゲートを通した CI からのみ publish する。
    # environment 側で required reviewers を設定すること（設定は GitHub UI / org-admin）。
    environment: npm-publish
    permissions:
      contents: read
      # provenance（来歴証明）の署名に必要。npm の Trusted Publisher 設定とも対になる。
      id-token: write
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          scope: '@upbond'
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - name: Publish (dist-tag from version)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *"-"* ]]; then TAG=rc; else TAG=latest; fi
          echo "Publishing $VERSION with dist-tag $TAG"
          npm publish --access public --provenance --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
